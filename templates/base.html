<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Music Inspiration Analyzer{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <style>
    :root {
      --bg: #f7f6f3; --card: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e4e1db;
      --accent: #5b4bd6; --accent-text: #ffffff; --soft: #efedff; --code: #f1efea; --err: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --card: #1f1f1d; --text: #ecebe8; --muted: #a29f98; --line: #34332f;
        --accent: #9d92ff; --accent-text: #15142a; --soft: #26244a; --code: #2a2926; --err: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
    header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    header.top a { color: inherit; text-decoration: none; font-weight: 650; font-size: 1.1rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
    h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; cursor: pointer;
           background: var(--accent); color: var(--accent-text); padding: 11px 18px; font: inherit; font-weight: 600;
           text-decoration: none; }
    .btn.secondary { background: var(--soft); color: var(--text); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .error { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent);
             border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
    a { color: var(--accent); }
    code, pre { background: var(--code); border-radius: 6px; }
    code { padding: 1px 5px; font-size: .9em; }
    pre { padding: 12px; overflow-x: auto; font-size: .85rem; line-height: 1.35; }
    pre code { padding: 0; background: none; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: .93rem; display: block; overflow-x: auto; }
    th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<main>
  <header class="top"><a href="{{ url_for('index') }}">🎵 Music Inspiration Analyzer</a></header>
  {% block content %}{% endblock %}
</main>
</body>
</html>
