services:
  music-analyzer:
    build:
      context: .
      args:
        # 1 = include Demucs AI drum separation (bigger image, slower jobs). Set in .env.
        WITH_DEMUCS: ${WITH_DEMUCS:-0}
        # 0 = leave out the style model behind "Find music like this" (smaller image). Set in .env.
        WITH_STYLE_MODEL: ${WITH_STYLE_MODEL:-1}
    restart: unless-stopped
    ports:
      # Only reachable from the server itself; put nginx/Caddy/Cloudflare Tunnel in front.
      # Change HOST_PORT in .env if 8090 is taken by another site.
      - "127.0.0.1:${HOST_PORT:-8090}:8000"
    # Hard caps so an analysis can never starve the other sites on this server.
    # A job that exceeds the memory cap fails with a clear message instead of freezing the machine.
    cpus: ${CPU_LIMIT:-1.0}
    # 2500m: an analysis, the style/instrument model (~800 MB) and, during a deploy, the self-test (.env.example)
    mem_limit: ${MEM_LIMIT:-2500m}
    memswap_limit: ${MEM_LIMIT:-2500m}
    env_file:
      - path: .env
        required: false
    volumes:
      - music-data:/data

volumes:
  music-data:
